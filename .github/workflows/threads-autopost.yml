# Положите файл в репозиторий по пути .github/workflows/threads-autopost.yml
# Секрет THREADS_ACCESS_TOKEN: Settings → Secrets and variables → Actions
name: Threads autopost

on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (в :07 и :37) — укладывается в бесплатный лимит
  workflow_dispatch:          # ручной запуск

permissions:
  contents: write

concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python threads_poster.py
      - name: Save statuses back to repo
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.csv
          git diff --cached --quiet && exit 0
          git commit -m "Threads: обновлены статусы постов"
          git pull --rebase
          git push
