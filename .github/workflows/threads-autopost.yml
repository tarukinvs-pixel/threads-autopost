# Автопостинг в Threads и Instagram из posts.csv.
# Секреты: THREADS_ACCESS_TOKEN, INSTAGRAM_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
#
# Расписание GitHub ненадёжно: запуски по cron могут опаздывать на часы.
# Поэтому один запуск не завершается сразу, а дежурит до 5 ч 40 мин:
# раз в 2 минуты публикует всё, чьё время наступило, и сохраняет статусы.
# Запуски по cron стоят каждый час с 8:07 до 20:07 по Уфе — хотя бы один из них сработает.
name: Threads autopost

on:
  schedule:
    - cron: "7 3-15 * * *"    # 8:07–20:07 по Уфе (UTC+5), каждый час
  workflow_dispatch:           # ручной запуск

permissions:
  contents: write

concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts (watch loop)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          end=$((SECONDS + 20400))   # 5 ч 40 мин
          while :; do
            git pull -q --rebase || true
            { echo "=== $(TZ=Asia/Yekaterinburg date '+%F %T')"; timeout 1500 python -u threads_poster.py 2>&1; } | tee -a run.log || true
            tail -n 300 run.log > run.tmp && mv run.tmp run.log
            git add posts.csv
            if ! git diff --cached --quiet; then
              git add run.log
              git commit -qm "Threads: обновлены статусы постов" || true
              git pull -q --rebase && git push -q || echo "push не удался, повторю"
            fi
            # Нечего ждать в ближайшие 6 часов — выходим, чтобы не тратить минуты.
            python threads_poster.py --upcoming 6 || { echo "Больше нет постов в очереди"; break; }
            [ $SECONDS -ge $end ] && { echo "Лимит времени, передаю следующему запуску"; break; }
            sleep 120
          done
